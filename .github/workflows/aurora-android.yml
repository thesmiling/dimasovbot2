name: Aurora Twin Android APK

on:
  push:
    branches:
      - aurora-android-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build native Compose demo
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android API 37
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;36.0.0' 'platform-tools'
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Extract native project
        run: unzip -oq aurora-android/source_bundle.zip -d ./source
      - name: Restore missing Compose saveable dependency
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/AuroraTwinAndroid/app/build.gradle.kts")
          s = p.read_text()
          if 'androidx.compose.runtime:runtime-saveable' not in s:
              s = s.replace('implementation("androidx.compose.ui:ui")', 'implementation("androidx.compose.ui:ui")\n    implementation("androidx.compose.runtime:runtime-saveable")')
              p.write_text(s)
          PY
      - name: Apply UX fixes
        run: python3 .github/scripts/aurora_ux_fix.py
      - name: Apply native living graphics
        run: python3 .github/scripts/aurora_motion_apply.py
      - name: Apply Soft Mirror v0.3
        run: python3 .github/scripts/aurora_soft_mirror_apply.py
      - name: Apply Motion v0.4 base
        run: python3 .github/scripts/aurora_motion_v4.py
      - name: Apply Motion v0.5 performance and light pass
        run: python3 .github/scripts/aurora_motion_v5.py
      - name: Unit tests and APK
        working-directory: source/AuroraTwinAndroid
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AuroraTwin-demo-debug-apk
          path: source/AuroraTwinAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
